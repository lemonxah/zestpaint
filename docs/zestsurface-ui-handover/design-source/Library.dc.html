<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZestSurface library window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:#f5c84b}a:hover{color:#ffe08a}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; flex-direction: column; background: #111214; color: #e4e5e9; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12.5px; color-scheme: dark; overflow: hidden">
  <!-- window title + tabs -->
  <header style="height: 44px; display: flex; align-items: center; gap: 16px; padding: 0 14px; background: #0b0c0e; border-bottom: 1px solid #24262b">
    <span style="font-weight: 600">Library</span>
    <div role="tablist" aria-label="Library kind" style="display: inline-flex; background: #17181c; border: 1px solid #2a2c31; border-radius: 7px; padding: 2px; gap: 2px">
      <button role="tab" aria-selected="{{matOn}}" onClick="{{showMat}}" style="height: 28px; padding: 0 14px; border: 0; border-radius: 5px; background: {{matBg}}; color: {{matFg}}; cursor: pointer">Materials</button>
      <button role="tab" aria-selected="{{brOn}}" onClick="{{showBr}}" style="height: 28px; padding: 0 14px; border: 0; border-radius: 5px; background: {{brBg}}; color: {{brFg}}; cursor: pointer">Brushes &amp; stamps</button>
    </div>
    <span style="flex: 1"></span>
    <span style="color: #8d909a">Painting into <span style="color: #e4e5e9">Sphere › Default</span></span>
  </header>

  <!-- toolbar -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #24262b; background: #17181c; flex-wrap: wrap">
    <label style="display: flex; align-items: center; gap: 8px; height: 32px; width: 320px; padding: 0 10px; background: #0f1012; border: 1px solid #2a2c31; border-radius: 7px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a6af" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input aria-label="Filter" placeholder="{{filterHint}}" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none">
    </label>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button style="height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>
    <span style="flex: 1"></span>
    <span style="color: #a3a6af; font-family: 'IBM Plex Mono', monospace">{{count}}</span>
    <button style="height: 30px; padding: 0 10px; background: transparent; border: 1px solid #33363c; border-radius: 6px; cursor: pointer">Clear</button>
    <button style="height: 30px; padding: 0 10px; background: transparent; border: 1px solid #33363c; border-radius: 6px; cursor: pointer">Rescan</button>
    <sc-if value="{{isBr}}" hint-placeholder-val="{{ false }}">
      <button style="height: 30px; padding: 0 10px; background: #26282d; border: 1px solid #33363c; border-radius: 6px; cursor: pointer">Import brush set…</button>
      <button style="height: 30px; padding: 0 10px; background: #26282d; border: 1px solid #33363c; border-radius: 6px; cursor: pointer">Import folder…</button>
    </sc-if>
  </div>

  <div style="flex: 1; min-height: 0; display: flex">
    <!-- sources -->
    <nav aria-label="Sources" style="width: 196px; flex: none; padding: 12px 8px; border-right: 1px solid #24262b; display: flex; flex-direction: column; gap: 2px; background: #15161a">
      <span style="padding: 0 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8d909a">Sources</span>
      <sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
        <a href="#" style="display: flex; align-items: center; height: 30px; padding: 0 8px; border-radius: 6px; text-decoration: none; color: {{s.fg}}; background: {{s.bg}}"><span style="flex: 1">{{s.label}}</span><span style="font-family: 'IBM Plex Mono', monospace; color: #8d909a; font-size: 11px">{{s.n}}</span></a>
      </sc-for>
      <span style="flex: 1"></span>
      <p style="margin: 0; padding: 8px; color: #8d909a; line-height: 1.5; font-size: 11.5px">Folder: <span style="font-family: 'IBM Plex Mono', monospace; color: #a3a6af; word-break: break-all">{{folder}}</span><br>Fill it with <span style="font-family: 'IBM Plex Mono', monospace; color: #a3a6af">matfetch</span>.</p>
    </nav>

    <!-- grid -->
    <main style="flex: 1; min-width: 0; padding: 14px; overflow: hidden">
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="15">
          <button onClick="{{it.pick}}" style="display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 9px; border: 1px solid {{it.border}}; background: {{it.bg}}; cursor: pointer; text-align: left">
            <span style="display: block; aspect-ratio: 1 / 1; border-radius: 6px; background: {{it.sw}}"></span>
            <span style="padding: 0 2px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
          </button>
        </sc-for>
      </div>
    </main>

    <!-- details -->
    <aside aria-label="Details" style="width: 300px; flex: none; border-left: 1px solid #24262b; background: #1a1b1f; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="display: block; aspect-ratio: 1 / 1; border-radius: 10px; background: {{sel.sw}}; border: 1px solid #2f3137"></span>
      <h2 style="margin: 0; font-size: 16px; font-weight: 600">{{sel.name}}</h2>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="color: #8d909a">{{mapsLabel}}</span>
        <div style="display: flex; gap: 4px; flex-wrap: wrap">
          <sc-for list="{{sel.maps}}" as="m" hint-placeholder-count="4">
            <span style="font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; padding: 2px 6px; border-radius: 4px; background: #26282d; color: #c9cbd1">{{m}}</span>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="color: #8d909a">Tags</span>
        <span style="color: #c9cbd1">{{sel.tags}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="color: #8d909a">Source</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #a3a6af; word-break: break-all">{{sel.src}}</span>
      </div>
      <span style="flex: 1"></span>
      <button style="height: 38px; border: 0; border-radius: 8px; background: {{accent}}; color: #1a1500; font-weight: 600; cursor: pointer">{{primary}}</button>
      <span style="color: #8d909a; line-height: 1.5; font-size: 11.5px">{{primaryNote}}</span>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84B"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  state = { kind: 'mat', sel: 3 };
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#F5C84B';
    const mat = s.kind === 'mat';
    const g = (a, b) => 'radial-gradient(circle at 35% 30%, ' + a + ' 0%, ' + b + ' 70%, #111 100%)';
    const mats = [
      ['Denim twill', g('#7d9ac4', '#2c3e5e'), 'fabric, denim', 'Poly Haven'],
      ['Floral lace', g('#f3ece2', '#9c9286'), 'fabric, lace', 'ambientCG'],
      ['Fishnet', g('#555', '#1b1b1b'), 'fabric, net', 'ambientCG'],
      ['Weathered copper', g('#7fc8a9', '#6b4a2b'), 'metal, patina', 'Poly Haven'],
      ['Oak planks', g('#c9955c', '#5e3c1e'), 'wood', 'Poly Haven'],
      ['Brushed steel', g('#d6d9dd', '#4a4e54'), 'metal', 'ambientCG'],
      ['Leather, worn', g('#8a4f2f', '#2e1a10'), 'leather', 'My materials'],
      ['Velvet', g('#9b3a63', '#3a1024'), 'fabric', 'ambientCG'],
      ['Rubber, matte', g('#3d3f42', '#141516'), 'rubber', 'ambientCG'],
      ['Painted metal', g('#d9573b', '#5a1c10'), 'metal, paint', 'Poly Haven'],
      ['Silk satin', g('#efe3f5', '#7e6a8a'), 'fabric', 'My materials'],
      ['Walnut', g('#8a5a3a', '#2c1a0e'), 'wood', 'Poly Haven'],
      ['Gold, polished', g('#ffe08a', '#7a5a12'), 'metal', 'ambientCG'],
      ['Knit wool', g('#cbbfa8', '#5c5244'), 'fabric, knit', 'ambientCG'],
      ['Carbon fibre', g('#4a4d52', '#0c0d0e'), 'composite', 'My materials']
    ];
    const t = (a) => 'radial-gradient(circle, ' + a + ' 0 22%, rgba(0,0,0,0) 60%), #0f1012';
    const brs = [
      ['Stitch, running', t('#ddd'), 'stitch, seam', 'GIMP .gbr'], ['Zipper teeth', t('#ccc'), 'zipper', 'image'],
      ['Seam, double', t('#bbb'), 'seam', 'Photoshop .abr'], ['Leak drip', t('#aaa'), 'leak', 'image'],
      ['Wrinkle, soft', t('#999'), 'wrinkle', 'Photoshop .abr'], ['Rivet, round', t('#eee'), 'stamp, metal', 'image'],
      ['Grunge 03', t('#888'), 'grunge', 'GIMP .gih'], ['Scratch fine', t('#ddd'), 'scratch', 'Photoshop .abr'],
      ['Chalk', t('#ccc'), 'dry', 'GIMP .gbr'], ['Splatter', t('#bbb'), 'splatter', 'image']
    ];
    const list = mat ? mats : brs;
    const idx = Math.min(s.sel, list.length - 1);
    const items = list.map((m, i) => ({ name: m[0], sw: m[1], pick: () => this.setState({ sel: i }), border: i === idx ? accent : 'transparent', bg: i === idx ? '#25261f' : 'transparent' }));
    const cur = list[idx];
    const folder = mat ? '~/.zestsurface/library/materials' : '~/.zestsurface/library/brushes';
    const chipLabels = mat ? ['fabric', 'lace', 'net', 'wood', 'metal'] : ['stitch', 'zipper', 'seam', 'leak', 'wrinkle'];
    const chips = chipLabels.map((c, i) => ({ label: c, bg: i === 4 && mat ? '#25261f' : 'transparent', border: i === 4 && mat ? accent : '#33363c', fg: '#c9cbd1' }));
    const srcs = mat ? [['All', 128], ['Poly Haven', 64], ['ambientCG', 52], ['My materials', 12]] : [['All', 46], ['Imported sets', 30], ['Images', 16]];
    const sources = srcs.map((x, i) => ({ label: x[0], n: x[1], bg: i === 0 ? '#26282d' : 'transparent', fg: i === 0 ? '#f2f3f5' : '#c9cbd1' }));
    return {
      accent, items, chips, sources, folder, isBr: !mat,
      matOn: mat ? 'true' : 'false', brOn: mat ? 'false' : 'true',
      matBg: mat ? '#2e3036' : 'transparent', matFg: mat ? '#f2f3f5' : '#a3a6af',
      brBg: mat ? 'transparent' : '#2e3036', brFg: mat ? '#a3a6af' : '#f2f3f5',
      showMat: () => this.setState({ kind: 'mat', sel: 3 }), showBr: () => this.setState({ kind: 'br', sel: 0 }),
      filterHint: mat ? 'fabric, lace, net, wood, metal' : 'stitch, zipper, seam, leak, wrinkle',
      count: list.length + ' of ' + (mat ? 128 : 46),
      sel: { name: cur[0], sw: cur[1], tags: cur[2], src: mat ? folder + '/' + cur[3].toLowerCase().replace(/ /g, '_') : cur[3], maps: mat ? ['COL', 'RGH', 'MTL', 'NRM', 'HGT', 'AO'] : ['TIP', 'GREYSCALE'] },
      mapsLabel: mat ? 'Maps' : 'Tip',
      primary: mat ? 'Apply as fill layer' : 'Use as brush tip',
      primaryNote: mat ? 'Adds a new layer with a black mask. Paint the mask to reveal it. You can also drag a material onto the viewport.' : 'Replaces the active tool tip. Stamp tool uses it as the stamp image.'
    };
  }
}
</script>
</body>
</html>
