[package]
name = "matfetch"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Ryno Kotze <lemon.xah@gmail.com>"]
description = "Sync and download CC0 PBR materials and brush stamps from Poly Haven and ambientCG"

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = "3"
zip = { version = "8", default-features = false, features = ["deflate", "bzip2", "zstd"] }
